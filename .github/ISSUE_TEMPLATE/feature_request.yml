name: 🚀 Feature Request
description: Propose a new clearing flow, currency support, or banking feature.
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to expand Ledger Core (e.g. multi-currency settlement, Pesalink integration, or Kafka streaming)? Let us know!

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Business Context
      description: Is your feature request related to a specific financial settlement challenge?
      placeholder: "e.g. As an institution, we need to settle across East African currencies..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative designs, APIs, or architectural approaches you considered.
